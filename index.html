<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BTC Battle — Up or Down?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .pulse { animation: pulse 1s infinite; }
    @keyframes pulse { 50% { transform: scale(1.05); } }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center">

  <div class="max-w-md w-full p-6 text-center space-y-6">

    <!-- Title -->
    <h1 class="text-3xl font-bold">🟠 BTC Battle</h1>
    <p class="text-slate-400">Will Bitcoin go up or down in the next 30 seconds?</p>

    <!-- Last Close -->
    <div class="bg-slate-900 rounded-2xl p-4">
      <p class="text-slate-400 text-sm">Last minute closing price</p>
      <p id="lastClose" class="text-4xl font-bold">$—</p>
      <p id="errorMsg" class="text-sm text-amber-400 mt-2 hidden">🚨 Oops! Something went wrong! 🏃‍♂️💨 Omw to fix it</p>
    </div>

    <!-- Timer -->
    <div>
      <p class="text-slate-400">Result in</p>
      <p id="timer" class="text-3xl font-bold pulse">30s</p>
    </div>

    <!-- Question -->
    <div class="bg-slate-900 rounded-2xl p-4 space-y-4">
      <p class="text-slate-300 text-lg">📊 Will BTC go up or down?</p>
      <div class="flex gap-4">
        <button id="upBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 rounded-xl py-3 text-xl">⬆ UP</button>
        <button id="downBtn" class="flex-1 bg-rose-600 hover:bg-rose-700 rounded-xl py-3 text-xl">⬇ DOWN</button>
      </div>
      <p id="lockedText" class="text-sm text-emerald-400 hidden">Choice locked! Let’s see 👀</p>
    </div>

    <!-- Result -->
    <div id="resultBox" class="bg-slate-900 rounded-2xl p-4 hidden space-y-2">
      <p id="priceMove"></p>
      <p id="userResult"></p>
      <p id="aiResult"></p>
      <p id="winner" class="text-xl font-bold"></p>
    </div>

    <!-- Score -->
    <div class="flex justify-around text-lg">
      <p>🔥 You: <span id="userScore">0</span></p>
      <p>🤖 AI: <span id="aiScore">0</span></p>
    </div>

    <!-- History -->
    <div class="bg-slate-900 rounded-2xl p-4 text-left space-y-2">
      <p class="text-slate-300 font-semibold">🕒 Round history</p>
      <ul id="history" class="text-sm space-y-1 max-h-40 overflow-y-auto"></ul>
    </div>

    <p class="text-xs text-slate-500">Just a fun game. Not financial advice.</p>

  </div>

<script>
  const lastCloseEl = document.getElementById('lastClose');
  const timerEl = document.getElementById('timer');
  const upBtn = document.getElementById('upBtn');
  const downBtn = document.getElementById('downBtn');
  const lockedText = document.getElementById('lockedText');
  const resultBox = document.getElementById('resultBox');
  const priceMoveEl = document.getElementById('priceMove');
  const userResultEl = document.getElementById('userResult');
  const aiResultEl = document.getElementById('aiResult');
  const winnerEl = document.getElementById('winner');
  const userScoreEl = document.getElementById('userScore');
  const aiScoreEl = document.getElementById('aiScore');
  const historyEl = document.getElementById('history');
  const errorMsgEl = document.getElementById('errorMsg');

  let lastClose = null;
  let lastCloseReady = false;
  let livePrice = null;
  let userChoice = null;
  let aiChoice = null;
  let timer = 30;
  let userScore = 0;
  let aiScore = 0;
  let roundCount = 0;

  // Live trades for current price
  const tradeWS = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
  tradeWS.onmessage = (e) => {
    const data = JSON.parse(e.data);
    livePrice = parseFloat(data.p);
  };

  // Kline stream for future minute closes
  const klineWS = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@kline_1m');
  klineWS.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.k && msg.k.x) {
        const close = parseFloat(msg.k.c);
        if (!isNaN(close)) {
          lastClose = close;
          lastCloseReady = true;
          lastCloseEl.textContent = `$${lastClose.toFixed(2)}`;
          errorMsgEl.classList.add('hidden');
        }
      }
    } catch {
      showApiError();
    }
  };

  klineWS.onerror = () => showApiError();

  // Initial REST fetch so first load has data
  fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=1')
    .then(res => res.json())
    .then(data => {
      if (Array.isArray(data) && data.length > 0) {
        const close = parseFloat(data[0][4]);
        if (!isNaN(close)) {
          lastClose = close;
          lastCloseReady = true;
          lastCloseEl.textContent = `$${lastClose.toFixed(2)}`;
        }
      }
    })
    .catch(() => showApiError());

  function showApiError() {
    lastCloseEl.textContent = '— — — —';
    errorMsgEl.classList.remove('hidden');
  }

  upBtn.onclick = () => lockChoice('up');
  downBtn.onclick = () => lockChoice('down');

  function lockChoice(choice) {
    userChoice = choice;
    lockedText.classList.remove('hidden');
    upBtn.disabled = true;
    downBtn.disabled = true;
    upBtn.classList.add('opacity-50');
    downBtn.classList.add('opacity-50');
  }

  function aiPredictDirection() {
    return Math.random() > 0.5 ? 'up' : 'down';
  }

  function evaluateRound() {
    if (!lastCloseReady || livePrice == null) return;

    aiChoice = aiPredictDirection();
    const actualMove = livePrice >= lastClose ? 'up' : 'down';
    const diff = livePrice - lastClose;
    const arrow = actualMove === 'up' ? '⬆' : '⬇';

    priceMoveEl.textContent = `🟢 Price went ${actualMove.toUpperCase()} ${arrow} (${diff >= 0 ? '+' : ''}${diff.toFixed(2)})`;
    userResultEl.textContent = `YOU chose ${userChoice ? userChoice.toUpperCase() : 'NOTHING'}`;
    aiResultEl.textContent = `AI chose ${aiChoice.toUpperCase()}`;

    if (userChoice === actualMove) userScore++;
    if (aiChoice === actualMove) aiScore++;

    if (userChoice === actualMove && aiChoice !== actualMove) {
      winnerEl.textContent = '🏆 YOU WIN THIS ROUND!';
    } else if (aiChoice === actualMove && userChoice !== actualMove) {
      winnerEl.textContent = '🤖 AI WINS THIS ROUND';
    } else {
      winnerEl.textContent = '😐 TIE';
    }

    roundCount++;
    const historyItem = document.createElement('li');
    historyItem.textContent = `Round ${roundCount} — ${winnerEl.textContent}`;
    historyEl.prepend(historyItem);

    userScoreEl.textContent = userScore;
    aiScoreEl.textContent = aiScore;
    resultBox.classList.remove('hidden');

    userChoice = null;
    upBtn.disabled = false;
    downBtn.disabled = false;
    upBtn.classList.remove('opacity-50');
    downBtn.classList.remove('opacity-50');
    lockedText.classList.add('hidden');
  }

  setInterval(() => {
    timer--;
    timerEl.textContent = `${timer}s`;
    if (timer === 0) {
      evaluateRound();
      timer = 30;
    }
  }, 1000);
</script>

</body>
</html>
