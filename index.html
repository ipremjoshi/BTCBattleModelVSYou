<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BTC Battle — You vs AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .pulse { animation: pulse 1s infinite; }
    @keyframes pulse { 50% { transform: scale(1.05); } }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center">

  <div class="max-w-md w-full p-6 text-center space-y-6">

    <!-- Title -->
    <h1 class="text-3xl font-bold">🟠 BTC Battle</h1>
    <p class="text-slate-400">Guess the next price. Beat the AI 🤖</p>

    <!-- Live Price -->
    <div class="bg-slate-900 rounded-2xl p-4">
      <p class="text-slate-400 text-sm">Bitcoin price right now</p>
      <p id="livePrice" class="text-4xl font-bold">$—</p>
    </div>

    <!-- Timer -->
    <div>
      <p class="text-slate-400">Next result in</p>
      <p id="timer" class="text-3xl font-bold pulse">30s</p>
    </div>

    <!-- User Input -->
    <div class="bg-slate-900 rounded-2xl p-4 space-y-3">
      <p class="text-slate-400">🎯 Your guess for the next 30 seconds</p>
      <input id="userGuess" type="number" placeholder="Enter BTC price" class="w-full text-center text-xl bg-slate-800 rounded-xl py-3 outline-none focus:ring-2 focus:ring-emerald-500" />
      <p id="lockedText" class="text-sm text-emerald-400 hidden">Locked in! Let’s see 👀</p>
    </div>

    <!-- Result -->
    <div id="resultBox" class="bg-slate-900 rounded-2xl p-4 hidden space-y-2">
      <p id="realPrice"></p>
      <p id="userResult"></p>
      <p id="aiResult"></p>
      <p id="winner" class="text-xl font-bold"></p>
    </div>

    <!-- Score -->
    <div class="flex justify-around text-lg">
      <p>🔥 You: <span id="userScore">0</span></p>
      <p>🤖 AI: <span id="aiScore">0</span></p>
    </div>

    <p class="text-xs text-slate-500">Just a fun game. Not financial advice.</p>

  </div>

<script>
  const livePriceEl = document.getElementById('livePrice');
  const timerEl = document.getElementById('timer');
  const userGuessInput = document.getElementById('userGuess');
  const lockedText = document.getElementById('lockedText');
  const resultBox = document.getElementById('resultBox');
  const realPriceEl = document.getElementById('realPrice');
  const userResultEl = document.getElementById('userResult');
  const aiResultEl = document.getElementById('aiResult');
  const winnerEl = document.getElementById('winner');
  const userScoreEl = document.getElementById('userScore');
  const aiScoreEl = document.getElementById('aiScore');

  let livePrice = null;
  let userGuess = null;
  let aiGuess = null;
  let timer = 30;
  let userScore = 0;
  let aiScore = 0;

  // Live BTC price (Binance)
  const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    livePrice = parseFloat(data.p);
    livePriceEl.textContent = `$${livePrice.toFixed(2)}`;
  };

  userGuessInput.addEventListener('input', () => {
    userGuess = parseFloat(userGuessInput.value);
    if (!isNaN(userGuess)) lockedText.classList.remove('hidden');
  });

  function aiPredict() {
    const randomMove = (Math.random() - 0.5) * 40;
    return livePrice + randomMove;
  }

  function evaluateRound() {
    const realPrice = livePrice;
    aiGuess = aiPredict();

    const userDiff = Math.abs(realPrice - userGuess);
    const aiDiff = Math.abs(realPrice - aiGuess);

    realPriceEl.textContent = `🟢 Real price: $${realPrice.toFixed(2)}`;
    userResultEl.textContent = `YOU guessed $${userGuess?.toFixed(2)} (off by $${userDiff.toFixed(2)})`;
    aiResultEl.textContent = `AI guessed $${aiGuess.toFixed(2)} (off by $${aiDiff.toFixed(2)})`;

    if (userGuess == null) {
      winnerEl.textContent = '🤖 AI wins (no guess)';
      aiScore++;
    } else if (userDiff < aiDiff) {
      winnerEl.textContent = '🏆 YOU WIN THIS ROUND!';
      userScore++;
    } else {
      winnerEl.textContent = '🤖 AI WINS THIS ROUND';
      aiScore++;
    }

    userScoreEl.textContent = userScore;
    aiScoreEl.textContent = aiScore;
    resultBox.classList.remove('hidden');

    userGuess = null;
    userGuessInput.value = '';
    lockedText.classList.add('hidden');
  }

  setInterval(() => {
    timer--;
    timerEl.textContent = `${timer}s`;
    if (timer === 0) {
      evaluateRound();
      timer = 30;
    }
  }, 1000);
</script>

</body>
</html>
